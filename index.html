    html {
      scroll-behavior: smooth;
    }

    body {
      background: #fff8ed;
      color: #3b1f0f;
      line-height: 1.6;
    }

    header {
      background: #5b2d0c;

    nav a:hover {

    }

    .hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;

      background:
        linear-gradient(rgba(55,24,5,.70), rgba(55,24,5,.70)),
        url("anarsa.jpg") center/cover no-repeat;

      color: white;
    }

    .hero-content {
      max-width: 800px;
    }

    .tagline {
      font-size: 18px;

      margin-bottom: 12px;

      margin-bottom: 10px;
      text-shadow: 2px 3px 8px rgba(0,0,0,.5);
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 27px;
      margin: 5px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      background: #e9a13a;
      color: #3b1f0f;
      transition: .3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,.25);
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .call {
      background: white;
      color: #5b2d0c;
    }

    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      font-size: 35px;
      margin-bottom: 40px;
    }

    /* PRODUCT */

    .product {
      max-width: 1050px;
      margin: auto;
      background: white;
      border-radius: 22px;
      padding: 30px;
      display: flex;
      gap: 45px;
      align-items: center;
      box-shadow: 0 6px 25px rgba(0,0,0,.10);
    }

    .product img {
      width: 46%;
      max-width: 450px;
      border-radius: 18px;
      object-fit: cover;
    }

    .product-info {
      flex: 1;
    }

      font-size: 37px;
      margin-bottom: 12px;
    }

    .product-info p {
      font-size: 17px;
      margin-bottom: 12px;
    }
